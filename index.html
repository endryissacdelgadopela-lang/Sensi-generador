<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sensi Generator FF</title>

<style>

body{
background:#0f0f0f;
font-family:Arial,sans-serif;
color:white;
text-align:center;
padding:20px;
}

.card{
max-width:600px;
margin:auto;
background:#1b1b1b;
padding:20px;
border-radius:20px;
box-shadow:0 0 15px rgba(255,140,0,.4);
}

h1{
color:#ff9800;
}

select{
width:90%;
padding:12px;
margin:8px;
border:none;
border-radius:10px;
font-size:16px;
}

button{
width:90%;
padding:14px;
margin-top:10px;
border:none;
border-radius:10px;
background:#ff9800;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

#resultado{
margin-top:20px;
padding:15px;
background:#252525;
border-radius:15px;
font-size:18px;
}

</style>
</head>

<body>

<div class="card">

<h1>🔥 SENSI GENERATOR FF 🔥</h1>

<select id="movil">
<option>Redmi 10C</option>
<option>Redmi Note 11</option>
<option>Samsung A15</option>
<option>Samsung A24</option>
<option>Infinix Hot 40</option>
<option>Tecno Spark 20</option>
<option>iPhone 11</option>
<option>iPhone 13</option>
</select>

<select id="modo">
<option>Estable</option>
<option>Rendimiento</option>
<option>Arrastre Rápido</option>
<option>Precisión</option>
</select>

<select id="dpi">
<option>Sin DPI</option>
<option>Con DPI</option>
</select>

<button onclick="generar()">
Generar Sensibilidad
</button>

<div id="resultado">
Selecciona una configuración.
</div>

</div>

<script>

function generar(){

let movil =
document.getElementById("movil").value;

let modo =
document.getElementById("modo").value;

let dpi =
document.getElementById("dpi").value;

let general;
let rojo;
let x2;
let x4;
let franco;
let disparo;

if(modo=="Estable"){
general=190;
rojo=185;
x2=175;
x4=165;
franco=120;
disparo=58;
}

if(modo=="Rendimiento"){
general=198;
rojo=192;
x2=182;
x4=170;
franco=118;
disparo=58;
}

if(modo=="Arrastre Rápido"){
general=200;
rojo=195;
x2=185;
x4=175;
franco=120;
disparo=60;
}

if(modo=="Precisión"){
general=180;
rojo=175;
x2=165;
x4=150;
franco=110;
disparo=55;
}

if(dpi=="Con DPI"){
general-=10;
rojo-=10;
x2-=10;
x4-=10;
}

document.getElementById("resultado").innerHTML =

"<h2>📱 "+movil+"</h2>"+

"🎯 General: "+general+"<br><br>"+

"🔴 Punto Rojo: "+rojo+"<br><br>"+

"🔍 Mira 2X: "+x2+"<br><br>"+

"🔭 Mira 4X: "+x4+"<br><br>"+

"🎯 Mira Franco: "+franco+"<br><br>"+

"🔥 Tamaño Botón Disparo: "+disparo+"%<br><br>"+

"⚡ Perfil: "+modo;

}

</script>

</body>
</html>￼EnterYPE html>
